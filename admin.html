<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<title>\u0644\u0648\u062d\u0629 \u0627\u0644\u062a\u062d\u0643\u0645 | \u0628\u0644\u062f\u064a\u0629 \u0628\u0648\u0632\u0631\u064a\u0639\u0629</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --green: #006233;
  --green-light: #00874a;
  --green-dark: #004a25;
  --gold: #C9A84C;
  --gold-light: #e8c96a;
  --white: #f4f7f5;
  --card: #ffffff;
  --border: #e2e8e4;
  --text: #1a2e1e;
  --muted: #6b8070;
  --red: #c0392b;
  --blue: #1a6fa8;
  --orange: #d4752a;
  --sidebar: #0d1f14;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Cairo', sans-serif;
  background: var(--white);
  color: var(--text);
  min-height: 100vh;
}

/* LOGIN */
#loginScreen {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--green-dark);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}

#loginScreen.hidden { display: none; }

.login-bg-circle {
  position: absolute; border-radius: 50%;
  background: radial-gradient(circle, rgba(201,168,76,0.12), transparent 70%);
  animation: floatC 8s ease-in-out infinite;
}
.login-bg-circle:nth-child(1) { width:450px;height:450px;top:-120px;right:-80px; }
.login-bg-circle:nth-child(2) { width:300px;height:300px;bottom:-60px;left:-60px;animation-delay:3s; }

.login-grid {
  position: absolute; inset: 0;
  background-image: linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);
  background-size: 60px 60px;
}

.login-box {
  position: relative; z-index: 2;
  width: 100%; max-width: 380px; padding: 1.5rem;
  animation: fadeUp 0.6s ease;
}

.login-logo { text-align: center; margin-bottom: 2rem; }
.login-emblem {
  width: 72px; height: 72px;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  border-radius: 20px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 2rem; margin-bottom: 1rem;
  box-shadow: 0 8px 25px rgba(201,168,76,0.4);
}
.login-logo h1 { font-family:'Tajawal',sans-serif;font-size:1.4rem;font-weight:900;color:white;margin-bottom:4px; }
.login-logo h1 span { color: var(--gold-light); }
.login-logo p { font-size:0.8rem;color:rgba(255,255,255,0.45); }

.login-card {
  background: rgba(255,255,255,0.07);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 22px; padding: 2rem;
  box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}

.login-card h2 { font-family:'Tajawal',sans-serif;font-size:1.1rem;font-weight:800;color:white;margin-bottom:1.5rem;text-align:center; }

.l-group { margin-bottom: 1rem; }
.l-group label { display:block;font-size:0.8rem;font-weight:600;color:rgba(255,255,255,0.7);margin-bottom:7px; }
.l-wrap { position:relative; }
.l-icon { position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:1rem;pointer-events:none; }
.l-group input {
  width:100%;background:rgba(255,255,255,0.08);
  border:1.5px solid rgba(255,255,255,0.12);border-radius:11px;
  padding:11px 42px 11px 14px;
  font-family:'Cairo',sans-serif;font-size:0.88rem;color:white;
  outline:none;transition:all 0.2s;direction:rtl;
}
.l-group input::placeholder { color:rgba(255,255,255,0.3); }
.l-group input:focus { border-color:var(--gold);background:rgba(255,255,255,0.12);box-shadow:0 0 0 4px rgba(201,168,76,0.1); }

.login-err { display:none;background:rgba(192,57,43,0.15);border:1px solid rgba(192,57,43,0.3);border-radius:10px;padding:10px 14px;font-size:0.82rem;color:#ff8a80;text-align:center;margin-bottom:1rem; }

.btn-login {
  width:100%;padding:13px;
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  border:none;border-radius:13px;
  font-family:'Cairo',sans-serif;font-size:0.95rem;font-weight:800;
  color:var(--green-dark);cursor:pointer;transition:all 0.25s;
  box-shadow:0 6px 20px rgba(201,168,76,0.35);
  margin-top:0.5rem;
}
.btn-login:hover { transform:translateY(-2px);box-shadow:0 10px 28px rgba(201,168,76,0.45); }

/* LAYOUT */
#adminApp { display:none;min-height:100vh;flex-direction:column; }
#adminApp.show { display:flex; }

.top-bar {
  background: var(--sidebar);
  color: white;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 1.5rem; height: 60px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  position: sticky; top: 0; z-index: 50;
}

.top-bar-logo { display:flex;align-items:center;gap:10px; }
.top-bar-logo .ico { width:34px;height:34px;background:linear-gradient(135deg,var(--gold),var(--gold-light));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem; }
.top-bar-logo span { font-family:'Tajawal',sans-serif;font-weight:800;font-size:0.95rem; }
.top-bar-logo small { display:block;font-size:0.65rem;opacity:0.5;font-weight:400; }

.top-bar-right { display:flex;align-items:center;gap:12px; }
.btn-preview {
  background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.8);
  border:1px solid rgba(255,255,255,0.15);border-radius:9px;
  padding:6px 14px;font-family:'Cairo',sans-serif;font-size:0.8rem;font-weight:600;
  cursor:pointer;transition:all 0.2s;text-decoration:none;display:flex;align-items:center;gap:6px;
}
.btn-preview:hover { background:rgba(255,255,255,0.15);color:white; }
.btn-logout { background:rgba(192,57,43,0.15);color:#ff8a80;border:1px solid rgba(192,57,43,0.25);border-radius:9px;padding:6px 14px;font-family:'Cairo',sans-serif;font-size:0.8rem;font-weight:600;cursor:pointer;transition:all 0.2s; }
.btn-logout:hover { background:rgba(192,57,43,0.25); }

.tab-nav {
  background: white;
  border-bottom: 2
