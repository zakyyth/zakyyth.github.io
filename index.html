<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIBE — Social Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --bg2: #111118;
    --bg3: #1a1a24;
    --card: #16161f;
    --border: #2a2a3a;
    --accent: #7c6aff;
    --accent2: #ff6a9b;
    --accent3: #6affcb;
    --text: #f0f0f8;
    --muted: #666680;
    --glow: rgba(124,106,255,0.3);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

  /* ── AUTH SCREEN ── */
  #auth-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(124,106,255,0.18) 0%, transparent 70%);
    position: relative;
  }
  #auth-screen::before {
    content: ''; position: absolute; inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%237c6aff' fill-opacity='0.04'%3E%3Ccircle cx='30' cy='30' r='1'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    pointer-events: none;
  }
  .auth-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 24px;
    padding: 48px 40px; width: 420px; max-width: 95vw;
    box-shadow: 0 0 80px rgba(124,106,255,0.12);
    animation: fadeUp 0.5s ease;
  }
  @keyframes fadeUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }
  .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 2.4rem; letter-spacing: -2px; margin-bottom: 6px; }
  .logo span { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .auth-tagline { color: var(--muted); font-size: 0.9rem; margin-bottom: 32px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 28px; background: var(--bg3); border-radius: 12px; padding: 4px; }
  .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--muted); border-radius: 10px; font-family: 'DM Sans', sans-serif; font-weight: 500; cursor: pointer; transition: all 0.2s; font-size: 0.9rem; }
  .tab-btn.active { background: var(--accent); color: white; box-shadow: 0 4px 16px var(--glow); }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; }
  .field input {
    width: 100%; padding: 12px 16px; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
    transition: border-color 0.2s, box-shadow 0.2s; outline: none;
  }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
  .btn-primary {
    width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), #9b6aff);
    border: none; border-radius: 12px; color: white; font-family: 'Syne', sans-serif;
    font-weight: 700; font-size: 1rem; cursor: pointer; letter-spacing: 0.5px;
    transition: transform 0.15s, box-shadow 0.15s; margin-top: 8px;
    box-shadow: 0 4px 20px var(--glow);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px var(--glow); }
  .btn-primary:active { transform: translateY(0); }
  .auth-err { color: var(--accent2); font-size: 0.82rem; margin-top: 8px; text-align: center; min-height: 20px; }

  /* ── MAIN APP ── */
  #app { display: none; height: 100vh; overflow: hidden; }
  .layout { display: grid; grid-template-columns: 260px 1fr 300px; grid-template-rows: 60px 1fr; height: 100vh; }

  /* TOPBAR */
  .topbar {
    grid-column: 1 / -1; display: flex; align-items: center; padding: 0 24px; gap: 16px;
    border-bottom: 1px solid var(--border); background: rgba(10,10,15,0.95); backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 100;
  }
  .topbar .logo { font-size: 1.5rem; margin-bottom: 0; }
  .topbar-search { flex: 1; max-width: 320px; margin: 0 auto; position: relative; }
  .topbar-search input {
    width: 100%; padding: 8px 16px 8px 38px; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 20px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.88rem;
    outline: none; transition: border-color 0.2s;
  }
  .topbar-search input:focus { border-color: var(--accent); }
  .topbar-search::before { content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 0.8rem; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; cursor: pointer; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; flex-shrink: 0; }
  .notif-btn { background: var(--bg3); border: 1px solid var(--border); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
  .notif-btn:hover { background: var(--bg2); }

  /* SIDEBAR */
  .sidebar { border-right: 1px solid var(--border); padding: 20px 12px; overflow-y: auto; background: var(--bg2); display: flex; flex-direction: column; gap: 4px; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px; cursor: pointer; transition: all 0.15s; color: var(--muted); font-weight: 500; font-size: 0.93rem; }
  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item.active { background: rgba(124,106,255,0.15); color: var(--accent); }
  .nav-icon { font-size: 1.2rem; width: 24px; text-align: center; }
  .nav-label {}
  .sidebar-section { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; padding: 16px 14px 6px; font-weight: 600; }
  .new-post-btn { margin: 12px 0 4px; background: linear-gradient(135deg, var(--accent), #9b6aff); border: none; border-radius: 12px; color: white; padding: 12px; width: 100%; font-family: 'Syne', sans-serif; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.9rem; transition: transform 0.15s; box-shadow: 0 4px 20px var(--glow); }
  .new-post-btn:hover { transform: translateY(-1px); }

  /* FEED */
  .feed { overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

  /* STORIES */
  .stories-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; }
  .stories-row::-webkit-scrollbar { height: 0; }
  .story-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; flex-shrink: 0; }
  .story-ring { width: 60px; height: 60px; border-radius: 50%; padding: 2px; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .story-inner { width: 100%; height: 100%; border-radius: 50%; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; border: 2px solid var(--bg2); }
  .story-name { font-size: 0.72rem; color: var(--muted); max-width: 60px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .add-story { background: var(--bg3); border: 2px dashed var(--border); }

  /* POST CARD */
  .post-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; transition: border-color 0.2s; }
  .post-card:hover { border-color: var(--accent); }
  .post-header { display: flex; align-items: center; gap: 12px; padding: 16px 16px 12px; }
  .post-meta { flex: 1; }
  .post-author { font-weight: 600; font-size: 0.93rem; }
  .post-time { font-size: 0.78rem; color: var(--muted); }
  .post-badge { font-size: 0.7rem; background: rgba(124,106,255,0.2); color: var(--accent); padding: 2px 8px; border-radius: 6px; margin-left: 6px; font-weight: 600; }
  .post-body { padding: 0 16px 14px; line-height: 1.6; font-size: 0.93rem; color: #d0d0e8; }
  .post-image { width: 100%; max-height: 320px; object-fit: cover; }
  .post-tags { padding: 0 16px 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 0.78rem; background: rgba(124,106,255,0.1); color: var(--accent); padding: 3px 10px; border-radius: 20px; cursor: pointer; }
  .post-actions { display: flex; padding: 12px 16px; border-top: 1px solid var(--border); gap: 4px; }
  .action-btn { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; border: none; background: transparent; color: var(--muted); cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; transition: all 0.15s; }
  .action-btn:hover { background: var(--bg3); color: var(--text); }
  .action-btn.liked { color: var(--accent2); }
  .action-btn.liked:hover { background: rgba(255,106,155,0.1); }

  /* RIGHT PANEL */
  .right-panel { border-left: 1px solid var(--border); padding: 20px 16px; overflow-y: auto; background: var(--bg2); display: flex; flex-direction: column; gap: 20px; }
  .panel-section { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
  .panel-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.9rem; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .online-user { display: flex; align-items: center; gap: 10px; padding: 8px 0; cursor: pointer; border-radius: 8px; transition: background 0.15s; }
  .online-user:hover { }
  .online-dot { width: 8px; height: 8px; background: var(--accent3); border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 6px var(--accent3); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
  .online-name { font-size: 0.88rem; font-weight: 500; }
  .trending-tag { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .trending-tag:last-child { border-bottom: none; }
  .trending-tag-name { font-size: 0.88rem; color: var(--accent); font-weight: 500; }
  .trending-count { font-size: 0.78rem; color: var(--muted); }

  /* ── CHAT PANEL ── */
  #chat-view { display: none; flex-direction: column; height: 100%; }
  .chat-list { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 16px; }
  .chat-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; cursor: pointer; transition: background 0.15s; }
  .chat-item:hover, .chat-item.active { background: var(--bg3); }
  .chat-item-info { flex: 1; overflow: hidden; }
  .chat-item-name { font-weight: 600; font-size: 0.9rem; }
  .chat-item-preview { font-size: 0.8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-window { display: none; flex-direction: column; height: 100%; }
  .chat-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  .chat-back { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.2rem; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 75%; display: flex; flex-direction: column; }
  .msg.mine { align-self: flex-end; }
  .msg-bubble { padding: 10px 14px; border-radius: 16px; font-size: 0.9rem; line-height: 1.5; }
  .msg.theirs .msg-bubble { background: var(--bg3); border: 1px solid var(--border); border-radius: 4px 16px 16px 16px; }
  .msg.mine .msg-bubble { background: linear-gradient(135deg, var(--accent), #9b6aff); color: white; border-radius: 16px 4px 16px 16px; }
  .msg-time { font-size: 0.72rem; color: var(--muted); padding: 2px 4px; }
  .msg.mine .msg-time { text-align: right; }
  .chat-input-area { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .chat-input { flex: 1; padding: 10px 16px; background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
  .chat-input:focus { border-color: var(--accent); }
  .send-btn { width: 40px; height: 40px; background: linear-gradient(135deg, var(--accent), #9b6aff); border: none; border-radius: 50%; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; transition: transform 0.15s; flex-shrink: 0; }
  .send-btn:hover { transform: scale(1.1); }

  /* ── MODAL ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
  .modal-overlay.open { display: flex; animation: fadeIn 0.2s; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 20px; width: 520px; max-width: 95vw; padding: 28px; }
  .modal-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.2rem; margin-bottom: 20px; }
  .modal textarea { width: 100%; padding: 14px; background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.95rem; resize: vertical; min-height: 120px; outline: none; transition: border-color 0.2s; }
  .modal textarea:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
  .btn-ghost { padding: 10px 20px; background: transparent; border: 1px solid var(--border); border-radius: 10px; color: var(--muted); cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 500; transition: all 0.15s; }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm { padding: 10px 20px; background: linear-gradient(135deg, var(--accent), #9b6aff); border: none; border-radius: 10px; color: white; cursor: pointer; font-family: 'Syne', sans-serif; font-weight: 700; transition: transform 0.15s; }
  .btn-sm:hover { transform: translateY(-1px); }
  .tag-input { width: 100%; padding: 10px 14px; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; outline: none; margin-top: 10px; transition: border-color 0.2s; }
  .tag-input:focus { border-color: var(--accent); }

  /* VIEWS */
  .view { display: none; flex-direction: column; overflow-y: auto; height: 100%; }
  .view.active { display: flex; }
  .page-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.5rem; padding: 20px 20px 0; margin-bottom: 20px; }

  /* Profile */
  .profile-hero { padding: 24px; display: flex; gap: 20px; align-items: flex-start; }
  .profile-avatar-lg { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 2rem; color: white; flex-shrink: 0; }
  .profile-info h2 { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.3rem; }
  .profile-bio { color: var(--muted); font-size: 0.88rem; margin-top: 6px; }
  .profile-stats { display: flex; gap: 24px; margin-top: 12px; }
  .stat { text-align: center; }
  .stat-val { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.1rem; }
  .stat-lbl { font-size: 0.75rem; color: var(--muted); }

  /* Explore */
  .explore-grid { padding: 0 20px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .explore-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; cursor: pointer; transition: all 0.2s; }
  .explore-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .explore-card-icon { font-size: 2rem; margin-bottom: 10px; }
  .explore-card-name { font-family: 'Syne', sans-serif; font-weight: 700; margin-bottom: 4px; }
  .explore-card-count { font-size: 0.8rem; color: var(--muted); }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: 60px 1fr 56px; }
    .sidebar { display: none; }
    .right-panel { display: none; }
    .feed { padding: 12px; }
  }
</style>
</head>
<body>

<!-- ════ AUTH SCREEN ════ -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="logo"><span>VIBE</span></div>
    <div class="auth-tagline">Where your stories come alive ✨</div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" onclick="switchTab('register')">Create Account</button>
    </div>

    <!-- LOGIN -->
    <div id="login-form">
      <div class="field"><label>Username</label><input id="li-user" placeholder="your_username" /></div>
      <div class="field"><label>Password</label><input id="li-pass" type="password" placeholder="••••••••" /></div>
      <button class="btn-primary" onclick="login()">Sign In →</button>
    </div>

    <!-- REGISTER -->
    <div id="register-form" style="display:none">
      <div class="field"><label>Full Name</label><input id="rg-name" placeholder="Your Name" /></div>
      <div class="field"><label>Username</label><input id="rg-user" placeholder="cool_username" /></div>
      <div class="field"><label>Email</label><input id="rg-email" placeholder="you@email.com" /></div>
      <div class="field"><label>Password</label><input id="rg-pass" type="password" placeholder="••••••••" /></div>
      <button class="btn-primary" onclick="register()">Create Account →</button>
    </div>
    <div class="auth-err" id="auth-err"></div>
  </div>
</div>

<!-- ════ MAIN APP ════ -->
<div id="app">
  <div class="layout">

    <!-- TOPBAR -->
    <div class="topbar">
      <div class="logo"><span>VIBE</span></div>
      <div class="topbar-search"><input placeholder="Search posts, people..." /></div>
      <div class="topbar-right">
        <div class="notif-btn">🔔</div>
        <div class="avatar" id="topbar-avatar">?</div>
        <button onclick="logout()" style="background:none;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:0.8rem;">Logout</button>
      </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
      <button class="new-post-btn" onclick="openPostModal()">＋ New Post</button>
      <div class="nav-item active" onclick="showView('feed',this)"><span class="nav-icon">🏠</span><span class="nav-label">Home Feed</span></div>
      <div class="nav-item" onclick="showView('explore',this)"><span class="nav-icon">🔭</span><span class="nav-label">Explore</span></div>
      <div class="nav-item" onclick="showView('chat',this)"><span class="nav-icon">💬</span><span class="nav-label">Messages</span></div>
      <div class="nav-item" onclick="showView('stories',this)"><span class="nav-icon">✨</span><span class="nav-label">Stories</span></div>
      <div class="nav-item" onclick="showView('profile',this)"><span class="nav-icon">👤</span><span class="nav-label">Profile</span></div>
      <div class="sidebar-section">Online Now</div>
      <div id="sidebar-online"></div>
    </div>

    <!-- MAIN CONTENT -->
    <div style="overflow:hidden;display:flex;flex-direction:column;">

      <!-- FEED VIEW -->
      <div class="view active" id="view-feed">
        <div class="feed" id="feed-container">
          <!-- Stories Row -->
          <div id="stories-section"></div>
          <!-- Posts injected here -->
        </div>
      </div>

      <!-- EXPLORE VIEW -->
      <div class="view" id="view-explore">
        <div class="page-title">Explore 🔭</div>
        <div class="explore-grid" id="explore-grid"></div>
      </div>

      <!-- CHAT VIEW -->
      <div class="view" id="view-chat" style="overflow:hidden;">
        <!-- Chat list -->
        <div id="chat-list-panel" style="display:flex;flex-direction:column;height:100%;">
          <div class="page-title" style="flex-shrink:0;">Messages 💬</div>
          <div class="chat-list" id="chat-list"></div>
        </div>
        <!-- Chat window -->
        <div id="chat-window" class="chat-window">
          <div class="chat-header">
            <button class="chat-back" onclick="closeChat()">←</button>
            <div class="avatar" id="chat-with-avatar">?</div>
            <div>
              <div id="chat-with-name" style="font-weight:600;font-size:0.95rem;"></div>
              <div style="font-size:0.78rem;color:var(--accent3);">● Online</div>
            </div>
          </div>
          <div class="chat-messages" id="chat-messages"></div>
          <div class="chat-input-area">
            <input class="chat-input" id="chat-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMsg()" />
            <button class="send-btn" onclick="sendMsg()">➤</button>
          </div>
        </div>
      </div>

      <!-- STORIES VIEW -->
      <div class="view" id="view-stories">
        <div class="page-title">Stories ✨</div>
        <div id="stories-list" style="padding:0 20px;display:flex;flex-direction:column;gap:12px;"></div>
      </div>

      <!-- PROFILE VIEW -->
      <div class="view" id="view-profile">
        <div class="profile-hero">
          <div class="profile-avatar-lg" id="profile-avatar-lg">?</div>
          <div class="profile-info">
            <h2 id="profile-name">—</h2>
            <div class="profile-bio" id="profile-bio">Vibe member ✨</div>
            <div class="profile-stats">
              <div class="stat"><div class="stat-val" id="stat-posts">0</div><div class="stat-lbl">Posts</div></div>
              <div class="stat"><div class="stat-val">128</div><div class="stat-lbl">Followers</div></div>
              <div class="stat"><div class="stat-val">94</div><div class="stat-lbl">Following</div></div>
            </div>
          </div>
        </div>
        <div style="padding: 0 20px;"><button class="btn-sm" onclick="openPostModal()">＋ Add New Post</button></div>
        <div class="feed" id="profile-posts" style="padding-top:16px;"></div>
      </div>

    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
      <div class="panel-section">
        <div class="panel-title">🟢 Online</div>
        <div id="online-list"></div>
      </div>
      <div class="panel-section">
        <div class="panel-title">🔥 Trending</div>
        <div id="trending-list"></div>
      </div>
    </div>

  </div>
</div>

<!-- ════ POST MODAL ════ -->
<div class="modal-overlay" id="post-modal">
  <div class="modal">
    <div class="modal-title">Create Post ✍️</div>
    <textarea id="post-text" placeholder="What's on your mind? Share your vibe..."></textarea>
    <input class="tag-input" id="post-tags" placeholder="Tags: #music #art #tech (optional)" />
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closePostModal()">Cancel</button>
      <button class="btn-sm" onclick="submitPost()">Publish →</button>
    </div>
  </div>
</div>

<script>
// ════ STATE ════
let users = JSON.parse(localStorage.getItem('vibe_users') || '{}');
let posts = JSON.parse(localStorage.getItem('vibe_posts') || '[]');
let chats = JSON.parse(localStorage.getItem('vibe_chats') || '{}');
let currentUser = null;
let chatWith = null;

const defaultUsers = {
  alex: { name: 'Alex Nova', password: '1234', bio: 'Designer & dreamer 🎨', emoji: 'A' },
  sara: { name: 'Sara Bloom', password: '1234', bio: 'Photographer 📸', emoji: 'S' },
  kai: { name: 'Kai Storm', password: '1234', bio: 'Music producer 🎵', emoji: 'K' },
  mia: { name: 'Mia Fox', password: '1234', bio: 'Writer & poet ✍️', emoji: 'M' },
};
if (!localStorage.getItem('vibe_users')) { users = { ...defaultUsers }; saveUsers(); }

const defaultPosts = [
  { id: 1, author: 'alex', text: 'Just finished a new UI project — feeling super inspired today! 🎨 The design process is such a journey.', tags: ['#design', '#ui'], time: '2h ago', likes: 24, liked: false },
  { id: 2, author: 'sara', text: 'Golden hour hits differently when you\'re in the mountains. 🌄 Captured some amazing shots today!', tags: ['#photography', '#nature'], time: '4h ago', likes: 61, liked: false },
  { id: 3, author: 'kai', text: 'New track dropping this Friday 🔥 Been working on the beat for weeks, finally nailed the drop. Stay tuned!', tags: ['#music', '#producer'], time: '6h ago', likes: 88, liked: false },
  { id: 4, author: 'mia', text: 'Started a new short story today. Sometimes the blank page is the most terrifying and exciting thing. ✍️', tags: ['#writing', '#creative'], time: '1d ago', likes: 35, liked: false },
];
if (!posts.length) { posts = defaultPosts; savePosts(); }

function saveUsers() { localStorage.setItem('vibe_users', JSON.stringify(users)); }
function savePosts() { localStorage.setItem('vibe_posts', JSON.stringify(posts)); }
function saveChats() { localStorage.setItem('vibe_chats', JSON.stringify(chats)); }

// ════ AUTH ════
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
  document.getElementById('login-form').style.display = tab==='login' ? '' : 'none';
  document.getElementById('register-form').style.display = tab==='register' ? '' : 'none';
  document.getElementById('auth-err').textContent = '';
}
function setErr(msg) { document.getElementById('auth-err').textContent = msg; }

function login() {
  const u = document.getElementById('li-user').value.trim().toLowerCase();
  const p = document.getElementById('li-pass').value;
  if (!u || !p) return setErr('Please fill all fields.');
  if (!users[u]) return setErr('Account not found.');
  if (users[u].password !== p) return setErr('Wrong password.');
  currentUser = u;
  launchApp();
}

function register() {
  const name = document.getElementById('rg-name').value.trim();
  const u = document.getElementById('rg-user').value.trim().toLowerCase();
  const p = document.getElementById('rg-pass').value;
  if (!name || !u || !p) return setErr('Please fill all fields.');
  if (users[u]) return setErr('Username already taken.');
  users[u] = { name, password: p, bio: 'New to VIBE! 👋', emoji: name[0].toUpperCase() };
  saveUsers();
  currentUser = u;
  launchApp();
}

function logout() {
  currentUser = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
}

function launchApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const u = users[currentUser];
  document.getElementById('topbar-avatar').textContent = u.emoji || u.name[0];
  document.getElementById('profile-avatar-lg').textContent = u.emoji || u.name[0];
  document.getElementById('profile-name').textContent = u.name;
  document.getElementById('profile-bio').textContent = u.bio;
  renderAll();
}

// ════ RENDER ════
function renderAll() {
  renderStories();
  renderFeed();
  renderOnline();
  renderTrending();
  renderChatList();
  renderExplore();
  renderProfilePosts();
}

function getAvatar(username) {
  const u = users[username];
  return u ? (u.emoji || u.name[0]) : '?';
}
function getName(username) {
  return users[username] ? users[username].name : username;
}

function renderStories() {
  const s = document.getElementById('stories-section');
  const sl = document.getElementById('stories-list');
  const storyUsers = Object.keys(users).filter(u => u !== currentUser);
  s.innerHTML = `<div class="stories-row">
    <div class="story-item" onclick="openPostModal()">
      <div class="story-ring"><div class="story-inner add-story">➕</div></div>
      <div class="story-name">Your Story</div>
    </div>
    ${storyUsers.map(u=>`
    <div class="story-item">
      <div class="story-ring"><div class="story-inner" style="font-size:1.3rem;">${getAvatar(u)}</div></div>
      <div class="story-name">${getName(u).split(' ')[0]}</div>
    </div>`).join('')}
  </div>`;

  sl.innerHTML = storyUsers.map(u=>`
    <div class="post-card" style="cursor:pointer;" onclick="">
      <div class="post-header">
        <div class="avatar" style="background:linear-gradient(135deg,var(--accent),var(--accent2));">${getAvatar(u)}</div>
        <div class="post-meta"><div class="post-author">${getName(u)}</div><div class="post-time">Active now</div></div>
      </div>
      <div class="post-body">✨ ${getName(u).split(' ')[0]} has a new story! Tap to view their vibe today.</div>
    </div>`).join('');
}

function renderFeed() {
  const feed = document.getElementById('feed-container');
  const storiesHTML = feed.querySelector('#stories-section') ? feed.querySelector('#stories-section').outerHTML : '';
  
  const postsHTML = [...posts].reverse().map(p => postHTML(p)).join('');
  feed.innerHTML = `<div id="stories-section"></div>${postsHTML}`;
  renderStories();
}

function postHTML(p) {
  const u = users[p.author] || {};
  const myPost = p.author === currentUser;
  return `<div class="post-card" id="post-${p.id}">
    <div class="post-header">
      <div class="avatar" style="background:linear-gradient(135deg,var(--accent),var(--accent2));">${getAvatar(p.author)}</div>
      <div class="post-meta">
        <div class="post-author">${getName(p.author)}${myPost?'<span class="post-badge">You</span>':''}</div>
        <div class="post-time">${p.time}</div>
      </div>
      ${myPost?`<button onclick="deletePost(${p.id})" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:4px;">🗑</button>`:''}
    </div>
    <div class="post-body">${p.text}</div>
    ${p.tags&&p.tags.length?`<div class="post-tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`:''}
    <div class="post-actions">
      <button class="action-btn ${p.liked?'liked':''}" onclick="toggleLike(${p.id})">
        ${p.liked?'❤️':'🤍'} ${p.likes}
      </button>
      <button class="action-btn" onclick="openChat('${p.author}')">💬 Comment</button>
      <button class="action-btn">🔁 Share</button>
    </div>
  </div>`;
}

function toggleLike(id) {
  const p = posts.find(x=>x.id===id);
  if (!p) return;
  p.liked = !p.liked;
  p.likes += p.liked ? 1 : -1;
  savePosts();
  renderFeed();
  renderProfilePosts();
}

function deletePost(id) {
  posts = posts.filter(p=>p.id!==id);
  savePosts();
  renderFeed();
  renderProfilePosts();
  updateStatPosts();
}

function renderProfilePosts() {
  const mine = posts.filter(p=>p.author===currentUser);
  document.getElementById('profile-posts').innerHTML = mine.length
    ? [...mine].reverse().map(p=>postHTML(p)).join('')
    : '<div style="padding:20px;color:var(--muted);text-align:center;">No posts yet. Create your first post! ✨</div>';
  updateStatPosts();
}

function updateStatPosts() {
  document.getElementById('stat-posts').textContent = posts.filter(p=>p.author===currentUser).length;
}

// ════ POST MODAL ════
function openPostModal() {
  document.getElementById('post-modal').classList.add('open');
  setTimeout(()=>document.getElementById('post-text').focus(), 100);
}
function closePostModal() {
  document.getElementById('post-modal').classList.remove('open');
  document.getElementById('post-text').value = '';
  document.getElementById('post-tags').value = '';
}
function submitPost() {
  const text = document.getElementById('post-text').value.trim();
  if (!text) return;
  const tagStr = document.getElementById('post-tags').value.trim();
  const tags = tagStr ? tagStr.split(/\s+/).map(t=>t.startsWith('#')?t:'#'+t) : [];
  const newPost = {
    id: Date.now(), author: currentUser, text, tags, time: 'Just now', likes: 0, liked: false
  };
  posts.push(newPost);
  savePosts();
  closePostModal();
  renderFeed();
  renderProfilePosts();
}

// ════ ONLINE / TRENDING ════
function renderOnline() {
  const names = Object.keys(users).filter(u=>u!==currentUser);
  const html = names.map(u=>`
    <div class="online-user" onclick="openChat('${u}')">
      <div class="avatar" style="width:32px;height:32px;font-size:0.8rem;">${getAvatar(u)}</div>
      <div class="online-name">${getName(u)}</div>
      <div class="online-dot" style="margin-left:auto;"></div>
    </div>`).join('');
  document.getElementById('online-list').innerHTML = html;

  const sideHtml = names.slice(0,4).map(u=>`
    <div class="nav-item" style="padding:8px 14px;" onclick="openChat('${u}')">
      <div class="avatar" style="width:28px;height:28px;font-size:0.75rem;">${getAvatar(u)}</div>
      <span style="font-size:0.85rem;">${getName(u).split(' ')[0]}</span>
      <div class="online-dot" style="margin-left:auto;width:6px;height:6px;"></div>
    </div>`).join('');
  document.getElementById('sidebar-online').innerHTML = sideHtml;
}

function renderTrending() {
  const trends = [
    { tag: '#design', count: '2.4k posts' },
    { tag: '#photography', count: '1.8k posts' },
    { tag: '#music', count: '3.1k posts' },
    { tag: '#creative', count: '987 posts' },
    { tag: '#coding', count: '1.2k posts' },
  ];
  document.getElementById('trending-list').innerHTML = trends.map(t=>`
    <div class="trending-tag">
      <div class="trending-tag-name">${t.tag}</div>
      <div class="trending-count">${t.count}</div>
    </div>`).join('');
}

// ════ EXPLORE ════
function renderExplore() {
  const cats = [
    {icon:'🎨', name:'Design', count:'4.2k posts'},
    {icon:'📸', name:'Photography', count:'7.1k posts'},
    {icon:'🎵', name:'Music', count:'9.3k posts'},
    {icon:'✍️', name:'Writing', count:'3.8k posts'},
    {icon:'💻', name:'Coding', count:'5.5k posts'},
    {icon:'🌍', name:'Travel', count:'11k posts'},
    {icon:'🍕', name:'Food', count:'8.9k posts'},
    {icon:'🏋️', name:'Fitness', count:'6.2k posts'},
    {icon:'🎮', name:'Gaming', count:'7.7k posts'},
    {icon:'📚', name:'Books', count:'2.1k posts'},
  ];
  document.getElementById('explore-grid').innerHTML = cats.map(c=>`
    <div class="explore-card">
      <div class="explore-card-icon">${c.icon}</div>
      <div class="explore-card-name">${c.name}</div>
      <div class="explore-card-count">${c.count}</div>
    </div>`).join('');
}

// ════ CHAT ════
function renderChatList() {
  const others = Object.keys(users).filter(u=>u!==currentUser);
  document.getElementById('chat-list').innerHTML = others.map(u=>{
    const key = chatKey(currentUser, u);
    const msgs = chats[key] || [];
    const last = msgs[msgs.length-1];
    return `<div class="chat-item" onclick="openChat('${u}')">
      <div class="avatar" style="font-size:0.9rem;">${getAvatar(u)}</div>
      <div class="chat-item-info">
        <div class="chat-item-name">${getName(u)}</div>
        <div class="chat-item-preview">${last ? last.text : 'Say hi! 👋'}</div>
      </div>
    </div>`;
  }).join('');
}

function chatKey(a, b) { return [a,b].sort().join('_'); }

function openChat(username) {
  if (username === currentUser) return;
  chatWith = username;
  showView('chat', document.querySelector('.nav-item:nth-child(4)'));
  document.getElementById('chat-list-panel').style.display = 'none';
  const win = document.getElementById('chat-window');
  win.style.display = 'flex';
  document.getElementById('chat-with-name').textContent = getName(username);
  document.getElementById('chat-with-avatar').textContent = getAvatar(username);
  renderMessages();
}

function closeChat() {
  chatWith = null;
  document.getElementById('chat-window').style.display = 'none';
  document.getElementById('chat-list-panel').style.display = 'flex';
}

function renderMessages() {
  if (!chatWith) return;
  const key = chatKey(currentUser, chatWith);
  const msgs = chats[key] || [];
  const el = document.getElementById('chat-messages');
  el.innerHTML = msgs.length ? msgs.map(m=>`
    <div class="msg ${m.from===currentUser?'mine':'theirs'}">
      <div class="msg-bubble">${m.text}</div>
      <div class="msg-time">${m.time}</div>
    </div>`).join('') : `<div style="text-align:center;color:var(--muted);padding:20px;font-size:0.88rem;">Start a conversation with ${getName(chatWith)}! 👋</div>`;
  el.scrollTop = el.scrollHeight;
}

function sendMsg() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || !chatWith) return;
  const key = chatKey(currentUser, chatWith);
  if (!chats[key]) chats[key] = [];
  chats[key].push({ from: currentUser, text, time: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) });
  saveChats();
  input.value = '';
  renderMessages();
  renderChatList();
  // Simulate reply after 1.5s
  setTimeout(()=>{
    const replies = ["That's cool! 😄","Tell me more!","I feel that 💯","Amazing! ✨","Haha agreed!","Love that vibe 🔥","No way! Really?","Let's catch up soon!"];
    chats[key].push({ from: chatWith, text: replies[Math.floor(Math.random()*replies.length)], time: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) });
    saveChats();
    renderMessages();
    renderChatList();
  }, 1200 + Math.random()*800);
}

// ════ NAVIGATION ════
function showView(name, el) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  if (name !== 'chat') { closeChat(); }
}

// close modal on overlay click
document.getElementById('post-modal').addEventListener('click', function(e) {
  if (e.target === this) closePostModal();
});
</script>
</body>
</html>
